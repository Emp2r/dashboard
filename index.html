<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dashboard famille</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap">
<style>
:root{
  --card:rgba(255,255,255,.055); --line:rgba(255,255,255,.09);
  --t1:#f5f5f7; --t2:rgba(235,235,245,.62); --t3:rgba(235,235,245,.36);
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a;
  --pink:#ff375f; --purple:#bf5af2; --teal:#64d2ff; --yellow:#ffd60a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html{font-size:1.25vw;font-size:min(1.25vw,2vh);background:#000}
body{height:100vh;overflow:hidden;background:#000;color:var(--t1);
  font-family:"Inter",-apple-system,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;transition:filter 2s}
body.night{filter:brightness(.38)}
.bg{position:fixed;left:0;top:0;right:0;bottom:0;z-index:0;
  background:
    radial-gradient(60% 70% at 8% 0%,rgba(10,132,255,.26),transparent 70%),
    radial-gradient(55% 60% at 100% 8%,rgba(100,210,255,.12),transparent 70%),
    radial-gradient(70% 70% at 95% 100%,rgba(191,90,242,.20),transparent 70%),
    radial-gradient(50% 55% at 0% 100%,rgba(255,55,95,.10),transparent 70%),
    #000}
#app{position:relative;z-index:1;height:100vh;padding:1.1rem 1.1rem 2.7rem;display:grid;gap:1rem;
  grid-template-columns:1fr 1.1fr 1fr;grid-template-rows:1fr 1fr}
.card{position:relative;min-height:0;min-width:0;overflow:hidden;display:flex;flex-direction:column;
  padding:1.45rem 1.6rem 1.4rem;border-radius:1.9rem;
  background:var(--card);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(28px) saturate(1.5);backdrop-filter:blur(28px) saturate(1.5);
  box-shadow:0 1.2rem 3rem rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.07)}
.label{display:flex;justify-content:space-between;align-items:center;font-size:.76rem;font-weight:600;
  letter-spacing:.15em;text-transform:uppercase;color:var(--t3);flex:none}
.label .r{letter-spacing:.04em;text-transform:none;font-weight:500;color:var(--t3)}
.pill{display:inline-block;padding:.12rem .55rem;border-radius:2rem;font-size:.7rem;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.1);color:var(--t2)}

/* Horloge */
#c-clock{justify-content:space-between;
  background:linear-gradient(155deg,rgba(10,132,255,.20),rgba(191,90,242,.10) 60%,rgba(255,255,255,.04))}
.hello{font-size:1.15rem;font-weight:500;color:var(--t2)}
.time{font-size:7.4rem;font-weight:200;letter-spacing:-.045em;line-height:.95;font-feature-settings:"tnum" 1;
  margin-left:-.25rem;white-space:nowrap}
.time .colon{animation:blink 2s ease-in-out infinite;position:relative;top:-.06em}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.date{font-size:1.6rem;font-weight:500;letter-spacing:-.01em}
.date small{display:block;font-size:.95rem;font-weight:400;color:var(--t2);margin-top:.2rem}
.sun{display:flex;gap:1.4rem;font-size:.95rem;color:var(--t2);font-weight:500}
.sun b{color:var(--t1);font-weight:500;margin-left:.3rem}

/* Météo */
.wnow{display:flex;align-items:center;justify-content:space-between;margin-top:.6rem}
.temp{font-size:5.6rem;font-weight:200;letter-spacing:-.05em;line-height:1;margin-left:-.2rem}
.temp sup{font-size:.5em;font-weight:300;vertical-align:top;position:relative;top:.12em;margin-left:.05em;color:var(--t2)}
.ic{display:block;width:4.6rem;height:4.6rem;filter:drop-shadow(0 .35rem .7rem rgba(0,0,0,.4))}
.wnow .ic{width:6rem;height:6rem}
.cond{font-size:1.3rem;font-weight:500;margin-top:.3rem}
.meta{font-size:.9rem;color:var(--t2);margin-top:.25rem;white-space:nowrap}
.meta b{color:var(--t1);font-weight:500}
.hours{margin-top:auto;display:grid;grid-template-columns:repeat(5,1fr);padding-top:.9rem;border-top:1px solid var(--line)}
.h{text-align:center}
.h .hh{font-size:.8rem;color:var(--t3);font-weight:500}
.h .ic{width:2.3rem;height:2.3rem;margin:.1rem auto;filter:none}
.h .ht{font-size:1.08rem;font-weight:500}
.h .hp{font-size:.7rem;color:var(--teal);font-weight:600;height:.9rem}

/* Trains */
.tnext{margin-top:.7rem}
.tnext .tt{font-size:4.6rem;font-weight:200;letter-spacing:-.04em;line-height:1;font-feature-settings:"tnum" 1;margin-left:-.15rem}
.route{font-size:1.15rem;font-weight:500;margin-top:.25rem}
.route span{color:var(--t3);margin:0 .35rem}
.when{display:flex;align-items:center;gap:.6rem;margin-top:.7rem;font-size:.95rem;color:var(--t2)}
.cd{display:inline-block;padding:.3rem .85rem;border-radius:2rem;font-weight:600;font-size:1rem;color:#fff;background:var(--blue)}
.cd.warn{background:var(--orange);color:#1a1000}
.cd.urgent{background:var(--red)}
.rt{display:inline-block;margin-left:.5rem;padding:.2rem .65rem;border-radius:2rem;font-size:.85rem;font-weight:600;background:rgba(255,255,255,.14);color:var(--t1);vertical-align:middle}
.rt.late{background:var(--orange);color:#1a1000}.rt.cancel{background:var(--red);color:#fff}
.tmsg{margin-top:.5rem;font-size:.82rem;color:var(--orange);line-height:1.25;max-height:2.6em;overflow:hidden}
.tthen{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding:.8rem 0;
  border-top:1px solid var(--line);font-size:.98rem}
.tthen b{font-weight:500;font-size:1.15rem;font-feature-settings:"tnum" 1}
.tthen span{color:var(--t2)}
.dots{display:flex;justify-content:space-between;padding-top:.7rem;border-top:1px solid var(--line)}
.dot{width:2rem;text-align:center;font-size:.78rem;font-weight:600;color:var(--t3)}
.dot i{display:block;width:1.9rem;height:1.9rem;line-height:1.9rem;border-radius:50%;font-style:normal;margin-bottom:.0rem}
.dot.tr i{background:rgba(48,209,88,.20);color:var(--green)}
.dot.today i{background:var(--blue);color:#fff}
.dot.today.tr i{background:var(--green);color:#04210d}

/* Listes */
.list{flex:1;min-height:0;margin-top:.8rem;overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 88%,transparent);mask-image:linear-gradient(#000 88%,transparent)}
.day{font-size:.74rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin:.55rem 0 .15rem}
.day:first-child{margin-top:0}
.ev{display:flex;align-items:center;padding:.5rem 0}
.ev i{flex:none;width:.28rem;height:2rem;border-radius:.2rem;margin-right:.85rem}
.ev .et{flex:none;width:4rem;font-size:.95rem;color:var(--t2);font-weight:500;font-feature-settings:"tnum" 1}
.ev .em{min-width:0;flex:1}
.ev .em b{display:block;font-weight:500;font-size:1.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .em span{display:block;font-size:.82rem;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--t3);font-size:1.05rem;padding-top:1rem}
.les{display:flex;align-items:center;padding:.5rem .7rem;margin:0 -.7rem;border-radius:1.1rem;position:relative}
.les.past{opacity:.33}
.les.now{background:rgba(10,132,255,.20);box-shadow:inset 0 0 0 1px rgba(10,132,255,.45)}
.les .lt{flex:none;width:3.4rem;font-size:.9rem;color:var(--t2);font-weight:500;line-height:1.25;font-feature-settings:"tnum" 1}
.les .lt small{display:block;color:var(--t3);font-size:.8rem}
.les .lm{min-width:0;flex:1}
.les .lm b{display:block;font-weight:500;font-size:1.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.les .lm span{display:block;font-size:.82rem;color:var(--t2)}
.les .bar{position:absolute;left:.7rem;right:.7rem;bottom:.2rem;height:.18rem;border-radius:.1rem;background:rgba(255,255,255,.12);overflow:hidden}
.les .bar u{display:block;height:100%;background:var(--blue);text-decoration:none}


/* Animation météo en fond de carte */
.fx{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none}
.card .in{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column}

/* Emplois du temps : carrousel */
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
.car{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;margin:.8rem -1.6rem 0;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;min-width:0;padding:0 1.6rem;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;cursor:pointer}
.shead{display:flex;align-items:center;flex:none}
.av{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:1.1rem;color:#fff}
.sn{margin-left:.75rem;min-width:0;flex:1}
.sn b{display:block;font-size:1.2rem;font-weight:600;line-height:1.15}
.sn span{display:block;font-size:.76rem;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd{text-align:right;font-size:.78rem;color:var(--t3);font-weight:500;line-height:1.35;flex:none}
.sd b{color:var(--orange);font-weight:600;font-size:.88rem}
.slist{flex:1;min-height:0;margin-top:.55rem;overflow:hidden;-webkit-mask-image:linear-gradient(#000 86%,transparent);mask-image:linear-gradient(#000 86%,transparent)}
.sl{display:flex;align-items:center;padding:.42rem .5rem;margin:0 -.5rem;border-radius:1rem;position:relative}
.sl i{flex:none;width:.28rem;height:2.1rem;border-radius:.2rem;margin-right:.8rem}
.sl.now{background:rgba(10,132,255,.20);box-shadow:inset 0 0 0 1px rgba(10,132,255,.45)}
.sl .lt{flex:none;width:3.2rem;font-size:.9rem;color:var(--t2);font-weight:500;line-height:1.2;font-feature-settings:"tnum" 1}
.sl .lt small{display:block;color:var(--t3);font-size:.78rem}
.sl .lm{min-width:0;flex:1}
.sl .lm b{display:block;font-weight:500;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl .lm span{display:block;font-size:.8rem;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl .bar{position:absolute;left:.5rem;right:.5rem;bottom:.12rem;height:.16rem;border-radius:.1rem;background:rgba(255,255,255,.12);overflow:hidden}
.sl .bar u{display:block;height:100%;background:var(--blue);text-decoration:none}
.pd{display:inline-block;width:1.05rem;height:1.05rem;padding:.3rem;background:rgba(255,255,255,.28);background-clip:content-box;border-radius:50%;vertical-align:middle}
.pd.on{background-color:#fff}

/* Vue semaine */
#wk{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;display:none;background:#000}
#wk.on{display:block}
#wk .bg{position:absolute}
#wk-in{position:relative;z-index:1;height:100%;padding:1rem 1.2rem 4.6rem;display:flex;flex-direction:column}
.wkbar{display:flex;align-items:center;justify-content:space-between;flex:none;margin-bottom:.8rem}
.wkwho{display:flex;align-items:center;width:17rem}
.wkwho .sn b{font-size:1.45rem}
.wktabs{display:flex}
.chip{padding:.55rem 1rem;margin:0 .2rem;border-radius:2rem;font-size:.95rem;font-weight:500;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.chip.on{background:rgba(255,255,255,.22);font-weight:600}
.cd2{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;margin-right:.45rem}
.wkab{text-align:right;width:17rem}
.seg{display:inline-flex;padding:.2rem;border-radius:2rem;background:rgba(255,255,255,.08)}
.seg button{padding:.4rem .85rem;border-radius:2rem;font-size:.85rem;font-weight:500;color:var(--t2)}
.seg button.on{background:rgba(255,255,255,.24);color:#fff;font-weight:600}
.lnk{display:block;margin:.3rem 0 0 auto;font-size:.68rem;color:var(--t3)}
.wkg{flex:1;min-height:0;display:grid;grid-template-columns:2.4rem repeat(5,1fr);grid-template-rows:auto 1fr;column-gap:.5rem}
.dh{text-align:center;font-size:.88rem;font-weight:600;color:var(--t2);padding:.1rem 0 .6rem}
.dh.today span{background:var(--blue);color:#fff;padding:.28rem .85rem;border-radius:2rem}
.ax{position:relative}
.ax span{position:absolute;right:.35rem;transform:translateY(-50%);font-size:.7rem;color:var(--t3);font-feature-settings:"tnum" 1}
.db{position:relative;border-radius:1rem;background:rgba(255,255,255,.04);border:1px solid var(--line);overflow:hidden}
.hl{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.07);text-decoration:none}
.lb{position:absolute;left:.25rem;right:.25rem;border-radius:.65rem;padding:.3rem .5rem .3rem .65rem;overflow:hidden;line-height:1.2}
.lb b{display:block;font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb span{display:block;font-size:.7rem;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb em{display:block;font-style:normal;font-size:.68rem;color:var(--t3);font-feature-settings:"tnum" 1}
.now{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:3}
.now:before{content:"";position:absolute;left:-.2rem;top:-.2rem;width:.6rem;height:.6rem;border-radius:50%;background:var(--red)}
#wk-back,#wx-back{position:absolute;right:1.4rem;bottom:1.2rem;z-index:5;padding:.8rem 1.7rem .8rem 1.2rem;border-radius:2rem;font-size:1.1rem;font-weight:600;
  background:rgba(255,255,255,.14);border:1px solid var(--line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#wk-back span,#wx-back span{font-size:1.6rem;line-height:0;margin-right:.35rem;position:relative;top:.1rem}

/* Prévisions météo plein écran */
#c-w0,#c-w1{cursor:pointer}
#wx{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;display:none;background:#000}
#wx.on{display:block}
#wx .bg{position:absolute}
#wx-in{position:relative;z-index:1;height:100%;padding:1rem 1.2rem 4.6rem;display:flex;flex-direction:column}
.wxg{flex:1;min-height:0;display:grid;grid-template-columns:25rem 1fr;column-gap:1rem}
.wxl{justify-content:space-between}
.wxchips{display:flex;margin-left:-.2rem}
.wxplace{font-size:1.7rem;font-weight:600;margin-top:1rem}
.wxplace span{display:block;font-size:.85rem;color:var(--t3);font-weight:500}
.wxbig{display:flex;align-items:center;justify-content:space-between;margin-top:.4rem}
.wxtemp{font-size:7.6rem;font-weight:200;letter-spacing:-.05em;line-height:1;margin-left:-.25rem}
.wxtemp sup{font-size:.5em;font-weight:300;vertical-align:top;position:relative;top:.12em;color:var(--t2)}
.wxbig .ic{width:7rem;height:7rem}
.wxcond{font-size:1.5rem;font-weight:500;margin-top:.2rem}
.wxhl{font-size:1rem;color:var(--t2);margin-top:.25rem}.wxhl b{color:var(--t1);font-weight:500}
.wxtiles{display:grid;grid-template-columns:1fr 1fr;grid-gap:.6rem}
.tile{padding:.75rem 1rem;border-radius:1.2rem;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.tile small{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);font-weight:600}
.tile b{display:block;font-size:1.45rem;font-weight:400;margin-top:.15rem;font-feature-settings:"tnum" 1}
.wxr{display:flex;flex-direction:column;min-height:0;min-width:0}
.hcard{flex:none}
.hscroll{display:flex;overflow-x:auto;margin-top:.8rem;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.hs{flex:none;width:4rem;text-align:center}
.hs .hh{font-size:.8rem;color:var(--t3);font-weight:500}
.hs .ic{width:2.4rem;height:2.4rem;margin:.25rem auto;filter:none}
.hs .ht{font-size:1.1rem;font-weight:500}
.hs .hp{font-size:.7rem;color:var(--teal);font-weight:600;height:.9rem}
.dcard{flex:1;min-height:0;margin-top:1rem}
.drows{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:.5rem}
.dr{flex:1;display:grid;grid-template-columns:7.4rem 2.6rem 3rem 2.8rem 1fr 2.8rem;align-items:center;border-top:1px solid var(--line);font-size:1.1rem;font-feature-settings:"tnum" 1}
.dr:first-child{border-top:0}
.dr .dn{font-weight:500}
.dr .ic{width:2.1rem;height:2.1rem;filter:none}
.dr .pp{font-size:.75rem;color:var(--teal);font-weight:600;text-align:center}
.dr .lo{text-align:right;color:var(--t3)}
.dr .hi{text-align:right;font-weight:500}
.trk{position:relative;height:.4rem;border-radius:.2rem;background:rgba(255,255,255,.13);margin:0 .9rem}
.trk i{position:absolute;top:0;bottom:0;border-radius:.2rem}
.trk u{position:absolute;top:50%;width:.65rem;height:.65rem;margin:-.33rem 0 0 -.33rem;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.55);text-decoration:none}

/* Pages (glisser à droite / à gauche) */
#pages{position:relative;z-index:1;display:flex;width:100vw;height:100vh;overflow:hidden;touch-action:pan-y;scrollbar-width:none}
#pages::-webkit-scrollbar{display:none}
#app,#p2{flex:0 0 100vw;width:100vw;scroll-snap-align:start;scroll-snap-stop:always}
.car{overscroll-behavior-x:contain}
#pg{position:fixed;left:50%;bottom:.5rem;transform:translateX(-50%);z-index:6;display:flex;gap:.2rem;padding:.2rem .35rem;border-radius:2rem;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pgd{display:block;width:1.9rem;height:1.5rem;padding:.4rem .6rem;background:#6b6b70;background-clip:content-box;border-radius:50%}
.pgd.on{background-color:#fff}

/* Vignette électricité + détail plein écran */
.mini{display:flex;align-items:flex-end;gap:.28rem;height:2.6rem;margin-top:auto}
.mini i{flex:1;border-radius:.25rem .25rem .1rem .1rem;background:linear-gradient(#5ac8fa,#0a84ff);min-height:2px}
.mini i.l{background:linear-gradient(#ffcc66,#ff9f0a)}
.mnote{font-size:.85rem;color:var(--t2);margin-top:.55rem;line-height:1.3}
.mnote b{color:var(--t1);font-weight:500}
#ed{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;display:none;background:#000}
#ed.on{display:block}
#ed .bg{position:absolute}
#ed-in{position:relative;z-index:1;height:100%;padding:1rem 1.2rem 4.6rem;box-sizing:border-box;display:grid;gap:1rem;grid-template-columns:1fr 1fr 1.05fr;grid-template-rows:1.3fr 1fr}
#ed-chart{grid-column:1 / 3}
#ed-bill{grid-column:3;grid-row:1 / 3}
#ed-back{position:absolute;right:1.4rem;bottom:1.2rem;z-index:5;padding:.8rem 1.7rem .8rem 1.2rem;border-radius:2rem;font-size:1.1rem;font-weight:600;
  background:rgba(255,255,255,.14);border:1px solid var(--line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#ed-back span{font-size:1.6rem;line-height:0;margin-right:.35rem;position:relative;top:.1rem}
.bl{display:grid;grid-template-columns:1fr auto 5.6rem;column-gap:.7rem;align-items:baseline;padding:.42rem 0;border-top:1px solid var(--line);font-size:.98rem;font-feature-settings:"tnum" 1}
.bl span{color:var(--t2)}.bl em{font-style:normal;font-size:.8rem;color:var(--t3);text-align:right}.bl b{font-weight:500;text-align:right;white-space:nowrap}
.bl.t{font-size:1.15rem}.bl.t span,.bl.t b{color:var(--t1);font-weight:600}
.bl.g span,.bl.g b{color:var(--t1)}
.bills{margin-top:.7rem;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start}
.bnote{font-size:.78rem;color:var(--t3);line-height:1.35;margin-top:auto;padding-top:.6rem}

/* Ménage */
#m-card{cursor:pointer}
.mrow{display:grid;grid-template-columns:5.2rem 1fr 3.2rem;align-items:center;gap:.6rem;font-size:.95rem;margin-top:.45rem}
.mrow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow b{text-align:right;font-weight:500;font-feature-settings:"tnum" 1}
.mbar{height:.5rem;border-radius:.3rem;background:rgba(255,255,255,.1);overflow:hidden}
.mbar u{display:block;height:100%;border-radius:.3rem;text-decoration:none}
.mhint{margin-top:auto;font-size:.82rem;color:var(--t3)}
#mn{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;display:none;background:#000}
#mn.on{display:block}
#mn .bg{position:absolute}
#mn-in{position:relative;z-index:1;height:100%;padding:1rem 1.2rem 4.6rem;box-sizing:border-box;display:grid;gap:1rem;grid-template-columns:1.15fr 1fr;grid-template-rows:auto 1fr}
#mn-add{grid-row:1 / 3}
#mn-his{min-height:0}
.mstep{font-size:1rem;font-weight:600;color:var(--t2);margin:.9rem 0 .55rem}
.kids{display:flex;gap:.6rem;flex-wrap:wrap}
.kb{flex:1 1 7rem;padding:.95rem .6rem;border-radius:1.2rem;font-size:1.25rem;font-weight:600;background:rgba(255,255,255,.08);border:2px solid transparent;color:var(--t1)}
.kb.on{border-color:currentColor;background:rgba(255,255,255,.16)}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;flex:1;min-height:0}
.tg.off{opacity:.4}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;border-radius:1.2rem;background:rgba(255,255,255,.08);color:var(--t1);font-size:1.1rem;font-weight:600;padding:.4rem}
.tb i{font-style:normal;font-size:1.7rem;line-height:1.1}
.tb small{font-size:.8rem;font-weight:500;color:var(--t2)}
.tb:active{background:rgba(255,255,255,.22)}
.mnav{display:flex;align-items:center;gap:.5rem}
.mnav button{width:2.2rem;height:2.2rem;border-radius:50%;background:rgba(255,255,255,.1);font-size:1.3rem;line-height:1;color:var(--t1)}
.mnav button[disabled]{opacity:.25}
.mnav span{min-width:8rem;text-align:center;font-weight:600;font-size:1rem}
.rec{margin-top:.7rem}
.rrow{display:grid;grid-template-columns:5.5rem 1fr 4.2rem 4rem;align-items:center;gap:.6rem;padding:.38rem 0;font-size:1rem;font-feature-settings:"tnum" 1}
.rrow b{text-align:right;font-weight:600}.rrow em{font-style:normal;text-align:right;color:var(--t2);font-size:.9rem}
.rtot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:.5rem;margin-top:.3rem;font-weight:600}
.hl2{flex:1;min-height:0;overflow-y:auto;margin-top:.5rem;-webkit-overflow-scrolling:touch}
.hr2{display:grid;grid-template-columns:7.2rem 5rem 1fr 2.6rem 3.4rem;align-items:center;gap:.5rem;padding:.42rem 0;border-top:1px solid var(--line);font-size:.92rem;font-feature-settings:"tnum" 1}
.hr2 span{color:var(--t2)}.hr2 b{font-weight:600}.hr2 em{font-style:normal;text-align:right;color:var(--t2)}
.hr2 button{height:1.9rem;border-radius:1rem;background:rgba(255,255,255,.08);color:var(--t2);font-size:.85rem}
.hr2 button.c{background:rgba(255,69,58,.85);color:#fff;font-weight:600}
#mn-toast{position:absolute;left:50%;bottom:1.3rem;transform:translate(-50%,300%);opacity:0;pointer-events:none;z-index:6;display:flex;align-items:center;gap:1rem;padding:.8rem 1rem .8rem 1.4rem;border-radius:2rem;background:rgba(48,209,88,.92);color:#fff;font-size:1.1rem;font-weight:600;transition:transform .3s,opacity .3s;max-width:70vw}
#mn-toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#mn-toast button{padding:.4rem .9rem;border-radius:1.2rem;background:rgba(0,0,0,.25);color:#fff;font-size:.95rem;font-weight:600}
#mn-toast.w{background:rgba(255,159,10,.95)}
#mn-back{position:absolute;right:1.4rem;bottom:1.2rem;z-index:5;padding:.8rem 1.7rem .8rem 1.2rem;border-radius:2rem;font-size:1.1rem;font-weight:600;
  background:rgba(255,255,255,.14);border:1px solid var(--line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#mn-back span{font-size:1.6rem;line-height:0;margin-right:.35rem;position:relative;top:.1rem}

/* Courses */
#c-shop{cursor:pointer}
.srow{display:flex;align-items:center;gap:.6rem;font-size:.98rem;margin-top:.42rem;white-space:nowrap;overflow:hidden}
.srow i{font-style:normal;font-size:1.25rem;line-height:1}
.srow span{overflow:hidden;text-overflow:ellipsis}
.srow b{margin-left:auto;font-weight:500;color:var(--t2)}
#sh{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;display:none;background:#000}
#sh.on{display:block}
#sh .bg{position:absolute}
#sh-in{position:relative;z-index:1;height:100%;padding:1rem 1.2rem 4.6rem;box-sizing:border-box;display:grid;gap:1rem;grid-template-columns:1.55fr 1fr}
#sh-in .card{min-height:0}
.sgrid{flex:1;min-height:0;overflow-y:auto;margin-top:.7rem;display:grid;gap:.6rem;align-content:start;-webkit-overflow-scrolling:touch}
.sgrid.cats{grid-template-columns:repeat(4,1fr)}
.sgrid.arts{grid-template-columns:repeat(5,1fr)}
.ct,.at{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;border-radius:1.2rem;background:rgba(255,255,255,.08);color:var(--t1);padding:.7rem .3rem;text-align:center}
.ct{height:8.6rem}.ct i,.at i{font-style:normal;line-height:1}
.ct i{font-size:2.6rem}.ct span{font-size:1rem;font-weight:600}.ct small{font-size:.78rem;color:var(--t2)}
.at{height:7.6rem}.at i{font-size:2.5rem}.at span{font-size:.92rem;font-weight:600;line-height:1.15}
.at.on{background:rgba(10,132,255,.35);box-shadow:inset 0 0 0 2px #0a84ff}
.at u{position:absolute;top:.4rem;right:.45rem;min-width:1.4rem;height:1.4rem;border-radius:.8rem;background:#0a84ff;color:#fff;font-size:.8rem;font-weight:700;line-height:1.4rem;text-align:center;text-decoration:none;padding:0 .35rem}
.at:active,.ct:active{background:rgba(255,255,255,.22)}
.sback{display:inline-flex;align-items:center;gap:.3rem;padding:.35rem .9rem .35rem .6rem;border-radius:2rem;background:rgba(255,255,255,.12);font-size:.95rem;font-weight:600;color:var(--t1)}
.shead{display:flex;align-items:center;justify-content:space-between;margin-top:.5rem}
.shead b{font-size:1.4rem;font-weight:600}
.lst{flex:1;min-height:0;overflow-y:auto;margin-top:.5rem;-webkit-overflow-scrolling:touch}
.li{display:grid;grid-template-columns:2.2rem 1fr auto auto;align-items:center;gap:.5rem;padding:.4rem 0;border-top:1px solid var(--line);font-size:1.05rem}
.li i{font-style:normal;font-size:1.5rem;text-align:center}
.li .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li.d .nm{text-decoration:line-through;color:var(--t3)}.li.d i{opacity:.4}
.qt{display:flex;align-items:center;gap:.3rem}
.qt button{width:2rem;height:2rem;border-radius:50%;background:rgba(255,255,255,.1);color:var(--t1);font-size:1.15rem;line-height:1}
.qt span{min-width:1.2rem;text-align:center;font-weight:600;font-feature-settings:"tnum" 1}
.ck{width:2.1rem;height:2.1rem;border-radius:50%;border:2px solid rgba(255,255,255,.3);color:#fff;font-size:1.1rem;line-height:1.7rem;text-align:center}
.li.d .ck{background:#30d158;border-color:#30d158}
.sact{display:flex;gap:.5rem;margin-top:.6rem}
.sact button{flex:1;padding:.65rem .5rem;border-radius:1.2rem;background:rgba(255,255,255,.1);color:var(--t1);font-size:.92rem;font-weight:600}
.sact button.b{background:#0a84ff;color:#fff}
.sact button.r{background:rgba(255,69,58,.8)}
.sadd{display:flex;gap:.5rem;margin-top:.6rem}
.sadd input{flex:1;min-width:0;padding:.6rem .9rem;border-radius:1.2rem;background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--t1);font-size:1rem;-webkit-user-select:text;user-select:text}
.sadd button{padding:.6rem 1.1rem;border-radius:1.2rem;background:#0a84ff;color:#fff;font-weight:600;font-size:.95rem}
#sh-back{position:absolute;right:1.4rem;bottom:1.2rem;z-index:5;padding:.8rem 1.7rem .8rem 1.2rem;border-radius:2rem;font-size:1.1rem;font-weight:600;
  background:rgba(255,255,255,.14);border:1px solid var(--line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#sh-back span{font-size:1.6rem;line-height:0;margin-right:.35rem;position:relative;top:.1rem}

/* Mobile : ?m=c */
#sh-tabs{display:none}
html.mob{font-size:max(15px,4vw)}
html.mob body{background:#000}
html.mob #pages,html.mob #pg,html.mob #sh-back{display:none!important}
html.mob #sh-in{grid-template-columns:1fr;padding:.7rem .7rem 4.4rem;gap:.7rem}
html.mob.tl #sh-main{display:none}
html.mob.ta #sh-list{display:none}
html.mob .sgrid.cats{grid-template-columns:repeat(2,1fr)}
html.mob .sgrid.arts{grid-template-columns:repeat(3,1fr)}
html.mob .ct{height:7rem}html.mob .at{height:6.6rem}
html.mob .at span{font-size:.82rem}
html.mob #sh-tabs{display:flex;position:fixed;left:.7rem;right:.7rem;bottom:.7rem;z-index:6;gap:.5rem;padding:.35rem;border-radius:2rem;background:rgba(40,40,44,.92);border:1px solid var(--line)}
html.mob #sh-tabs button{flex:1;padding:.8rem .3rem;border-radius:1.6rem;font-size:1rem;font-weight:600;color:var(--t2);background:transparent}
html.mob.tl #sh-tabs [data-tab=tl],html.mob.ta #sh-tabs [data-tab=ta]{background:#0a84ff;color:#fff}

/* Minuteur */
#c-clock{cursor:pointer}
.tmr{display:flex;align-items:center;gap:.7rem;font-size:1rem}
.tmr .ti{font-size:1.5rem;line-height:1}
.tmr b{font-size:2.1rem;font-weight:600;letter-spacing:-.02em;font-feature-settings:"tnum" 1;min-width:5.2rem}
.tmr.pause b{opacity:.55}
.tmr button{width:2.6rem;height:2.6rem;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:1.1rem;line-height:2.6rem;text-align:center;padding:0}
.tmr button.ok{width:auto;padding:0 1.1rem;border-radius:2rem;font-weight:700;background:#fff;color:#000;font-size:1rem}
.tmr.done{color:#fff}.tmr.done b{color:#ffd60a}
#c-clock.alarm{animation:alarmflash .7s ease-in-out infinite}
@keyframes alarmflash{0%,100%{background:linear-gradient(155deg,rgba(255,69,58,.55),rgba(255,69,58,.25))}50%{background:linear-gradient(155deg,rgba(255,69,58,.1),rgba(255,69,58,.05))}}
#tm{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;display:none;background:#000}
#tm.on{display:block}
#tm .bg{position:absolute}
#tm-in{position:relative;z-index:1;height:100%;padding:1rem 1.2rem 4.6rem;box-sizing:border-box;display:grid;gap:1rem;grid-template-columns:1.15fr 1fr}
#tm-in .card{min-height:0;justify-content:center}
.tdisp{font-size:7.5rem;font-weight:200;letter-spacing:-.04em;line-height:1;text-align:center;font-feature-settings:"tnum" 1;margin:.4rem 0 1rem}
.tdisp.p{opacity:.55}
.tpre{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin-bottom:.9rem}
.tpre button,.tkeys button{border-radius:1.3rem;background:rgba(255,255,255,.1);color:var(--t1);font-weight:600;font-size:1.25rem;padding:1.1rem .3rem}
.tpre button.on{background:rgba(10,132,255,.4);box-shadow:inset 0 0 0 2px #0a84ff}
.tpre button small{display:block;font-size:.8rem;font-weight:500;color:var(--t2)}
.tgo{width:100%;padding:1.15rem;border-radius:1.5rem;background:#30d158;color:#04230d;font-size:1.35rem;font-weight:700}
.tgo[disabled]{opacity:.35}
.tgo.o{background:#ff9f0a;color:#1a1000}.tgo.r{background:#ff453a;color:#fff}
.trow{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.tkeys{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:.6rem}
.tkeys button{font-size:1.7rem;font-weight:500;padding:.85rem 0}
.tkeys button:active,.tpre button:active{background:rgba(255,255,255,.25)}
.tsub{text-align:center;color:var(--t2);font-size:1.05rem;margin-bottom:.6rem}
#tm-back{position:absolute;right:1.4rem;bottom:1.2rem;z-index:5;padding:.8rem 1.7rem .8rem 1.2rem;border-radius:2rem;font-size:1.1rem;font-weight:600;
  background:rgba(255,255,255,.14);border:1px solid var(--line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#tm-back span{font-size:1.6rem;line-height:0;margin-right:.35rem;position:relative;top:.1rem}

/* Assistant IA */
#c-ia{grid-column:2 / 4;grid-row:2;cursor:pointer;justify-content:space-between;background:linear-gradient(150deg,rgba(10,132,255,.2),rgba(94,92,230,.16) 60%,rgba(255,255,255,.03))}
.iap{display:flex;align-items:center;gap:.8rem;padding:1rem 1.3rem;border-radius:2rem;background:rgba(255,255,255,.1);border:1px solid var(--line);font-size:1.25rem;color:var(--t2)}
.iap i{font-style:normal;font-size:1.5rem;color:#64d2ff}
.iac{display:flex;flex-wrap:wrap;gap:.6rem}
.iac button,.iasug button{padding:.65rem 1.1rem;border-radius:2rem;background:rgba(255,255,255,.1);color:var(--t1);font-size:1rem;font-weight:500}
.iac button:active,.iasug button:active{background:rgba(255,255,255,.25)}
#ia{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;display:none;background:#000}
#ia.on{display:block}
#ia .bg{position:absolute}
#ia-in{position:relative;z-index:1;height:100%;padding:1rem 1.2rem 4.6rem;box-sizing:border-box;display:flex;flex-direction:column;gap:.9rem}
#ia-bar{display:flex;gap:.7rem;flex:none}
#ia-q{flex:1;min-width:0;padding:1rem 1.4rem;border-radius:2rem;border:1px solid var(--line);background:rgba(255,255,255,.12);color:var(--t1);font-size:1.35rem;font-family:inherit;outline:none;-webkit-appearance:none}
#ia-q:focus{border-color:#0a84ff;background:rgba(255,255,255,.16)}
#ia-go{padding:0 2rem;border-radius:2rem;background:#0a84ff;color:#fff;font-size:1.25rem;font-weight:700}
#ia-go[disabled]{opacity:.4}
#ia-new{padding:0 1.1rem;border-radius:2rem;background:rgba(255,255,255,.12);color:var(--t1);font-size:.85rem;font-weight:600;line-height:1.2}
.iau{display:block;width:fit-content;max-width:75%;margin:1.1rem 0 .7rem auto;padding:.7rem 1.3rem;border-radius:1.5rem 1.5rem .4rem 1.5rem;background:rgba(10,132,255,.38);font-size:1.15rem}
.iau:first-child{margin-top:.2rem}
.iaa+.iau{margin-top:1.8rem}
#ia-card{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.iaa{font-size:1.28rem;line-height:1.5;max-width:78rem}
.iasecs{display:grid;grid-template-columns:1fr 1.25fr;gap:0 2.6rem;align-items:start}
.iasec:only-child{grid-column:1 / 3}
.iaa h2{font-size:2rem;font-weight:700;margin:0 0 .4rem}
.iaa h3{font-size:1.2rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#64d2ff;margin:1rem 0 .4rem}
.iaa p{margin:.3rem 0}
.iaa ul,.iaa ol{margin:.2rem 0 .6rem;padding-left:1.5rem}
.iaa li{margin:.3rem 0}
.iaa b{font-weight:700}
.iamsg{font-size:1.4rem;color:var(--t2);padding:2rem .5rem;text-align:center}
.iamsg.err{color:#ff8a80;font-size:1.15rem}
.iasug{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin-top:1rem}
.iasug button{font-size:1.15rem;padding:.9rem 1.4rem}
.iadots span{animation:iab 1.2s infinite both;display:inline-block}.iadots span:nth-child(2){animation-delay:.2s}.iadots span:nth-child(3){animation-delay:.4s}
@keyframes iab{0%,80%,100%{opacity:.2}40%{opacity:1}}
#ia-back{position:absolute;right:1.4rem;bottom:1.2rem;z-index:5;padding:.8rem 1.7rem .8rem 1.2rem;border-radius:2rem;font-size:1.1rem;font-weight:600;
  background:rgba(255,255,255,.14);border:1px solid var(--line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#ia-back span{font-size:1.6rem;line-height:0;margin-right:.35rem;position:relative;top:.1rem}

/* Citation du jour */
#c-quote{justify-content:space-between;background:linear-gradient(160deg,rgba(255,159,10,.16),rgba(191,90,242,.12) 70%,rgba(255,255,255,.03))}
.qbody{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;min-height:0;animation:qin 1.2s ease both}
@keyframes qin{from{opacity:0;transform:translateY(.4rem)}to{opacity:1;transform:none}}
.qmark{position:absolute;left:-.1rem;top:-.9rem;font-size:5.5rem;line-height:1;font-family:Georgia,serif;color:rgba(255,255,255,.14);pointer-events:none}
.qtxt{font-weight:500;letter-spacing:-.01em;line-height:1.25;position:relative;padding-top:1.1rem}
.qaut{margin-top:.8rem;font-size:.95rem;color:var(--t2);font-weight:500}

/* Page 2 : consommation */
#p2{height:100vh;padding:1.1rem 1.1rem 2.7rem;display:grid;gap:1rem;grid-template-columns:1fr 1.1fr 1fr;grid-template-rows:1fr 1fr;box-sizing:border-box}
#e-card{cursor:pointer}
.ehead{display:flex;justify-content:space-between;align-items:flex-start;flex:none;margin-top:.6rem}
.ebig{font-size:3.4rem;font-weight:200;letter-spacing:-.03em;line-height:1;font-feature-settings:"tnum" 1}
.ebig small,.tbig small{font-size:1.15rem;font-weight:400;color:var(--t2);margin-left:.5rem;letter-spacing:0}
.esub{font-size:.95rem;color:var(--t2);margin-top:.3rem}
.rng{display:inline-flex;padding:.2rem;border-radius:2rem;background:rgba(255,255,255,.08)}
.rng button{padding:.35rem .9rem;border-radius:2rem;font-size:.85rem;font-weight:500;color:var(--t2)}
.rng button.on{background:rgba(255,255,255,.22);color:#fff;font-weight:600}
.chart{flex:1;min-height:0;position:relative}
.plot{position:absolute;left:2.8rem;right:.2rem;top:1.4rem;bottom:1.9rem}
.gl{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.08)}
.gl span{position:absolute;left:-2.8rem;top:-.5rem;width:2.3rem;text-align:right;font-size:.7rem;color:var(--t3)}
.avg{position:absolute;left:0;right:0;border-top:1px dashed rgba(255,255,255,.4);z-index:2}
.avg span{position:absolute;right:calc(100% + .4rem);top:-.5rem;font-size:.66rem;color:var(--t2);white-space:nowrap}
.bars{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:flex-end}
.b{flex:1;height:100%;position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.b i{display:block;width:62%;max-width:2.4rem;min-height:2px;border-radius:.55rem .55rem .2rem .2rem;background:linear-gradient(#5ac8fa,#0a84ff)}
.b.last i{background:linear-gradient(#ffcc66,#ff9f0a)}
.b em{font-style:normal;font-size:.68rem;color:var(--t2);margin-bottom:.15rem;font-feature-settings:"tnum" 1;white-space:nowrap}
.b u{position:absolute;bottom:-1.65rem;left:0;right:0;text-align:center;font-size:.7rem;color:var(--t3);text-decoration:none;line-height:1.15}
.b.we u{color:rgba(255,159,10,.75)}
.tbig{font-size:4.6rem;font-weight:200;letter-spacing:-.04em;line-height:1;margin-top:.8rem;font-feature-settings:"tnum" 1}
.tsub{font-size:1.2rem;color:var(--t2);margin-top:.3rem;font-weight:500}
.tfoot{margin-top:auto;display:flex;align-items:center}
.tfoot.col{display:block}
.tnote{font-size:.85rem;color:var(--t2);line-height:1.35}
.tnote b{color:var(--t1);font-weight:500}
.tfoot .tnote{margin-left:.7rem}
.tfoot.col .tnote{margin-left:0}
.delta{display:inline-block;flex:none;padding:.28rem .75rem;border-radius:2rem;font-size:.9rem;font-weight:600}
.delta.down{background:rgba(48,209,88,.18);color:var(--green)}
.delta.up{background:rgba(255,159,10,.18);color:var(--orange)}
.pbar{height:.5rem;border-radius:.3rem;background:rgba(255,255,255,.12);overflow:hidden}
.pbar u{display:block;height:100%;border-radius:.3rem;background:linear-gradient(90deg,#5ac8fa,#0a84ff);text-decoration:none}
.pbar u.g{background:rgba(255,255,255,.4)}
.tfoot.col .pbar{margin-bottom:.6rem}
.wrow{display:flex;align-items:center;margin-bottom:.45rem;font-size:.85rem;color:var(--t2)}
.wrow span{flex:none;width:8.5rem}
.wrow .pbar{flex:1;margin:0 .7rem}
.wrow b{flex:none;width:2.6rem;text-align:right;color:var(--t1);font-weight:500}

/* ---- Animations ---- */
@keyframes cin{from{opacity:0;transform:translate3d(0,1.3rem,0) scale(.965)}to{opacity:1;transform:none}}
@keyframes ovin{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
@keyframes cupd{from{opacity:.45;transform:translate3d(0,.35rem,0)}to{opacity:1;transform:none}}
#app.enter>.card,#p2.enter>.card{animation:cin .6s cubic-bezier(.2,.8,.2,1) both}
#app.enter>.card:nth-child(2),#p2.enter>.card:nth-child(2){animation-delay:.06s}
#app.enter>.card:nth-child(3),#p2.enter>.card:nth-child(3){animation-delay:.12s}
#app.enter>.card:nth-child(4),#p2.enter>.card:nth-child(4){animation-delay:.18s}
#app.enter>.card:nth-child(5),#p2.enter>.card:nth-child(5){animation-delay:.24s}
#app.enter>.card:nth-child(6),#p2.enter>.card:nth-child(6){animation-delay:.30s}
#wk.on,#wx.on,#ed.on,#mn.on,#sh.on,#tm.on,#ia.on{animation:ovin .32s ease-out both}
#wk.on .card,#wx.on .card,#ed.on .card,#mn.on .card,#sh.on .card,#tm.on .card,#ia.on .card{animation:cin .55s cubic-bezier(.2,.8,.2,1) both}
#wk.on .card:nth-child(2),#wx.on .card:nth-child(2),#ed.on .card:nth-child(2),#mn.on .card:nth-child(2),#sh.on .card:nth-child(2),#tm.on .card:nth-child(2){animation-delay:.07s}
#ed.on .card:nth-child(3),#mn.on .card:nth-child(3){animation-delay:.14s}
#ed.on .card:nth-child(4){animation-delay:.21s}
.upd>*{animation:cupd .6s cubic-bezier(.2,.8,.2,1) both}
#c-clock,#c-w0,#c-w1,#e-card,#m-card,#c-shop,#c-ia{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
#c-clock:active,#c-w0:active,#c-w1:active,#e-card:active,#m-card:active,#c-shop:active,#c-ia:active{transform:scale(.982)}
button{transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .25s,opacity .2s}
button:active{transform:scale(.94)}
.pgd{transition:background-color .3s,transform .3s}
.pgd.on{transform:scale(1.15)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* =====================================================================
   CONFIGURATION — tout ce qu'il y a à régler est ici
   ===================================================================== */
var MOB=/[?&]m=c(&|$)/.test(location.search);
if(MOB) document.documentElement.className='mob tl';
var CONFIG = {
  // Adresse du relais et clé d'accès : fournies dans l'adresse de la page (?p=...&k=...),
  // jamais écrites dans ce fichier. Sans elles, la page affiche une démonstration.
  proxy: "",
  key: "",
  calendars: [ {id:"famille",name:"Famille",color:"#0a84ff"}, {id:"pierre",name:"Pierre",color:"#30d158"} ],
  places: [ {name:"Lieu A",sub:"Exemple",lat:48.857,lon:2.352}, {name:"Lieu B",sub:"Exemple",lat:45.764,lon:4.836} ],
  train: { from:"Gare A", to:"Gare B", days:[1,2,4,5], out:"07:30", back:"18:30" },
  nightFrom: 23, nightTo: 6   // l'écran s'assombrit entre ces heures
};
(function(){
  function g(n){var m=location.search.match(new RegExp('[?&]'+n+'=([^&]*)'));return m?decodeURIComponent(m[1]):null;}
  var p=g('p'),k=g('k');
  try{if(p)localStorage.setItem('dbp',p);if(k)localStorage.setItem('dbk',k);p=p||localStorage.getItem('dbp');k=k||localStorage.getItem('dbk');}catch(e){}
  CONFIG.proxy=p||'';CONFIG.key=k||'';
})();

/* =====================================================================
   EMPLOIS DU TEMPS DE LA FAMILLE
   Cours = [début, fin, matière, détail, semaine]   (semaine : "A", "B" ou vide = toutes)
   ===================================================================== */
var DEMO_DAYS={1:[["08:00","09:00","Maths","Salle 1"],["09:15","10:15","Français","Salle 2"],["10:30","11:30","Anglais","Salle 3"],["14:00","15:00","EPS","Gymnase"]]};
DEMO_DAYS[2]=DEMO_DAYS[1];DEMO_DAYS[3]=[DEMO_DAYS[1][0]];DEMO_DAYS[4]=DEMO_DAYS[1];DEMO_DAYS[5]=DEMO_DAYS[1];
var PEOPLE=[{name:'Exemple 1',sub:'Données de démonstration',color:'#0a84ff',days:DEMO_DAYS},{name:'Exemple 2',sub:'Données de démonstration',color:'#ff375f',days:DEMO_DAYS}];

var COLORS=[['devoir','#8e8e93'],['ap fran','#8e8e93'],['llc','#7d7aff'],['ens. pro','#5aa9ff'],['éco-gestion','#ffb020'],['éco-droit','#9b8cff'],
  ['math','#ffcc00'],['fran','#34c759'],['hist','#5e7cff'],['anglais','#0a84ff'],['espagnol','#ff5f7a'],['svt','#ff9f0a'],['phys','#ff6b57'],
  ['eps','#bf5af2'],['arts','#30b0c7'],['musicale','#e3b341'],['techno','#c98a4b'],['philo','#2dd4a3'],['vie de classe','#d946a8'],
  ['moral','#d946a8'],['emc','#d946a8'],['parcours','#ff8a3d'],['scientifique','#32ade6']];
function colorFor(t){t=t.toLowerCase();for(var i=0;i<COLORS.length;i++){if(t.indexOf(COLORS[i][0])>=0)return COLORS[i][1];}return '#8e8e93';}
function rgba(hex,a){var n=parseInt(hex.slice(1),16);return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
function hv(t){var a=t.split(':');return +a[0]+(+a[1])/60;}
function hf(ms){var d=new Date(ms);return d.getHours()+(d.getMinutes()/60);}

var swapAB=false; try{swapAB=localStorage.getItem('swapAB')==='1';}catch(e){}
var wk={open:false,i:0,view:'A'}, lastTouch=Date.now();
/* Semaine A = semaines ISO impaires (modifiable avec « Inverser A / B » dans la vue semaine) */
function weekLetter(d){var a=weekNo(d)%2===1; if(swapAB)a=!a; return a?'A':'B';}
function toMs(d,t){var a=t.split(':');return new Date(d.getFullYear(),d.getMonth(),d.getDate(),+a[0],+a[1]).getTime();}
function lessonsFor(p,d,letter){
  var L=letter||weekLetter(d), out=[];
  (p.days[d.getDay()]||[]).forEach(function(r){
    if(r[4]&&r[4]!==L) return;
    out.push({s:toMs(d,r[0]),e:toMs(d,r[1]),title:r[2],sub:r[3]||'',color:colorFor(r[2])});
  });
  return out.sort(function(a,b){return a.s-b.s;});
}
function personDay(p){
  var now=Date.now(), n=new Date();
  for(var i=0;i<9;i++){
    var d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i), l=lessonsFor(p,d);
    if(i===0) l=l.filter(function(x){return x.e>now;});
    if(l.length) return {l:l,off:i,d:d};
  }
  return null;
}

/* ---- Vignette : carrousel de 5 personnes ---- */
function slideHtml(p){
  var pd=personDay(p), now=Date.now();
  var head='<div class="shead"><span class="av" style="background:'+p.color+'">'+esc(p.name.charAt(0))+'</span><div class="sn"><b>'+esc(p.name)+'</b><span>'+esc(p.sub)+'</span></div>';
  if(!pd) return head+'</div><div class="empty">Aucun cours à venir.</div>';
  var lab=pd.off===0?'Aujourd’hui':pd.off===1?'Demain':cap(JOURS[pd.d.getDay()]);
  head+='<div class="sd"><b>'+lab+' ›</b><br>Semaine '+weekLetter(pd.d)+'</div></div>';
  var rows='';
  pd.l.forEach(function(L){
    var cur=now>=L.s&&now<L.e, pr=cur?Math.round((now-L.s)/(L.e-L.s)*100):0;
    rows+='<div class="sl'+(cur?' now':'')+'"><i style="background:'+L.color+'"></i><div class="lt">'+hm(L.s)+'<small>'+hm(L.e)+'</small></div><div class="lm"><b>'+esc(L.title)+'</b>'+(L.sub?'<span>'+esc(L.sub)+'</span>':'')+'</div>'+(cur?'<div class="bar"><u style="width:'+pr+'%"></u></div>':'')+'</div>';
  });
  return head+'<div class="slist">'+rows+'</div>';
}
function renderEdtSlides(){for(var i=0;i<PEOPLE.length;i++) put('sl'+i,slideHtml(PEOPLE[i]));}
function edtInit(){
  var card=document.getElementById('c-edt');
  var dots=PEOPLE.map(function(p,i){return '<i class="pd'+(i===0?' on':'')+'" data-i="'+i+'"></i>';}).join('');
  var sl=PEOPLE.map(function(p,i){return '<div class="slide" data-i="'+i+'" id="sl'+i+'"></div>';}).join('');
  card.innerHTML='<div class="label"><span>Emplois du temps</span><span class="r" id="pds">'+dots+'</span></div><div class="car" id="car">'+sl+'</div>';
  var car=document.getElementById('car'), ticking=false;
  car.addEventListener('scroll',function(){
    if(ticking) return; ticking=true;
    requestAnimationFrame(function(){
      ticking=false; var i=Math.round(car.scrollLeft/Math.max(1,car.clientWidth)), ds=document.querySelectorAll('#pds .pd');
      for(var k=0;k<ds.length;k++) ds[k].className='pd'+(k===i?' on':'');
    });
  });
  car.addEventListener('click',function(e){
    var t=e.target; while(t&&t!==car&&!(t.className==='slide')) t=t.parentNode;
    if(t&&t!==car) openWeek(+t.getAttribute('data-i'));
  });
  document.getElementById('pds').addEventListener('click',function(e){
    var i=e.target.getAttribute('data-i'); if(i!==null) car.scrollTo({left:i*car.clientWidth,behavior:'smooth'});
  });
}

/* ---- Vue semaine complète ---- */
var DJ=['Lundi','Mardi','Mercredi','Jeudi','Vendredi'];
function weekBase(){var n=new Date(),dw=n.getDay();return (dw===0||dw===6)?new Date(n.getFullYear(),n.getMonth(),n.getDate()+(dw===6?2:1)):n;}
function openWeek(i){wk.open=true;wk.i=i;wk.view=weekLetter(weekBase());document.getElementById('wk').className='on';renderWeek();}
function closeWeek(){wk.open=false;document.getElementById('wk').className='';}
function renderWeek(){
  var p=PEOPLE[wk.i], n=new Date(), base=weekBase(), dow=(base.getDay()+6)%7;
  var mon=new Date(base.getFullYear(),base.getMonth(),base.getDate()-dow), cur=weekLetter(base), v=wk.view, mn=24, mx=0;
  Object.keys(p.days).forEach(function(k){p.days[k].forEach(function(r){mn=Math.min(mn,hv(r[0]));mx=Math.max(mx,hv(r[1]));});});
  var h0=Math.floor(mn), h1=Math.ceil(mx), span=h1-h0;
  var todayIdx=(n.getDay()+6)%7, isWeekday=n.getDay()>=1&&n.getDay()<=5, showToday=isWeekday&&v===weekLetter(n);
  var tabs=PEOPLE.map(function(q,i){return '<button class="chip'+(i===wk.i?' on':'')+'" data-act="p" data-i="'+i+'"><span class="cd2" style="background:'+q.color+'"></span>'+esc(q.name)+'</button>';}).join('');
  var bar='<div class="wkbar"><div class="wkwho"><span class="av" style="background:'+p.color+'">'+esc(p.name.charAt(0))+'</span><div class="sn"><b>'+esc(p.name)+'</b><span>'+esc(p.sub)+'</span></div></div>'+
    '<div class="wktabs">'+tabs+'</div>'+
    '<div class="wkab"><div class="seg"><button data-act="w" data-v="A" class="'+(v==='A'?'on':'')+'">Semaine A'+(cur==='A'?' •':'')+'</button><button data-act="w" data-v="B" class="'+(v==='B'?'on':'')+'">Semaine B'+(cur==='B'?' •':'')+'</button></div>'+
    '<button class="lnk" data-act="swap">• = semaine en cours · Inverser A / B</button></div></div>';
  var heads='<div></div>', ax='', i, h;
  for(h=h0;h<=h1;h++) ax+='<span style="top:'+((h-h0)/span*100)+'%">'+h+'h</span>';
  var bodies='<div class="ax">'+ax+'</div>';
  for(i=0;i<5;i++){
    var d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i), isT=showToday&&i===todayIdx, b='';
    heads+='<div class="dh'+(isT?' today':'')+'"><span>'+DJ[i]+'</span></div>';
    for(h=h0;h<=h1;h++) b+='<u class="hl" style="top:'+((h-h0)/span*100)+'%"></u>';
    lessonsFor(p,d,v).forEach(function(L){
      var top=(hf(L.s)-h0)/span*100, ht=(hf(L.e)-hf(L.s))/span*100, past=isT&&L.e<n.getTime();
      b+='<div class="lb" style="top:'+top+'%;height:calc('+ht+'% - 2px);background:'+rgba(L.color,.24)+';box-shadow:inset 3px 0 0 '+L.color+(past?';opacity:.42':'')+'"><b>'+esc(L.title)+'</b>'+(L.sub?'<span>'+esc(L.sub)+'</span>':'')+'<em>'+hm(L.s)+' – '+hm(L.e)+'</em></div>';
    });
    if(isT){var nt=(hf(n.getTime())-h0)/span*100; if(nt>=0&&nt<=100) b+='<div class="now" style="top:'+nt+'%"></div>';}
    bodies+='<div class="db">'+b+'</div>';
  }
  document.getElementById('wk-in').innerHTML=bar+'<div class="wkg">'+heads+bodies+'</div>';
}
function wkInit(){
  var el=document.getElementById('wk-in');
  el.addEventListener('click',function(e){
    var t=e.target; while(t&&t!==el&&!(t.getAttribute&&t.getAttribute('data-act'))) t=t.parentNode;
    if(!t||t===el) return;
    var a=t.getAttribute('data-act');
    if(a==='p') wk.i=+t.getAttribute('data-i');
    else if(a==='w') wk.view=t.getAttribute('data-v');
    else if(a==='swap'){swapAB=!swapAB;try{localStorage.setItem('swapAB',swapAB?'1':'0');}catch(x){} wk.view=weekLetter(weekBase()); render();}
    renderWeek();
  });
  document.getElementById('wk-back').addEventListener('click',closeWeek);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeWeek();});
  ['touchstart','mousedown','keydown','scroll'].forEach(function(ev){document.addEventListener(ev,function(){lastTouch=Date.now();},true);});
  setInterval(function(){          // retour automatique si personne ne touche l'écran
    var idle=Date.now()-lastTouch, car=document.getElementById('car'), any=wk.open||wx.open||edf.open||mn.open||SH.open||TM.open||IA.open;
    if(IA.open&&idle>600000) closeIa();
    if((wk.open||wx.open||edf.open||mn.open||SH.open||TM.open)&&idle>90000){closeWeek();closeWx();closeEd();closeMn();closeShop();closeTm();}
    else if(!any&&idle>120000&&car&&car.scrollLeft>5) car.scrollTo({left:0,behavior:'smooth'});
    if(!any&&idle>180000&&window.curPage>0&&window.goPage) window.goPage(0);
  },5000);
}

/* =====================================================================
   OUTILS
   ===================================================================== */
var JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
var MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var DAYS=['SU','MO','TU','WE','TH','FR','SA'];
function pad(n){return (n<10?'0':'')+n;}
function hm(t){var d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function sod(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();}
function dayDiff(a,b){return Math.round((sod(new Date(b))-sod(new Date(a)))/86400000);}
function fetchT(u,ms){
  return new Promise(function(res,rej){
    var t=setTimeout(function(){rej(new Error('timeout'));},ms);
    fetch(u).then(function(r){clearTimeout(t);if(!r.ok)throw new Error('HTTP '+r.status);res(r);})
            .catch(function(e){clearTimeout(t);rej(e);});
  });
}
function api(params){
  return CONFIG.proxy+(CONFIG.proxy.indexOf('?')<0?'?':'&')+'k='+encodeURIComponent(CONFIG.key)+'&'+params;
}

/* =====================================================================
   ICÔNES MÉTÉO (SVG)
   ===================================================================== */
function rays(cx,cy,r1,r2){
  var s='';for(var i=0;i<8;i++){var a=i*Math.PI/4;
    s+='M'+(cx+Math.cos(a)*r1).toFixed(1)+' '+(cy+Math.sin(a)*r1).toFixed(1)+'L'+(cx+Math.cos(a)*r2).toFixed(1)+' '+(cy+Math.sin(a)*r2).toFixed(1);}
  return s;
}
function sunSvg(cx,cy,r,r1,r2){return '<path d="'+rays(cx,cy,r1,r2)+'" stroke="#FFC233" stroke-width="3.2" stroke-linecap="round" fill="none"/><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="url(#gSun)"/>';}
var CLOUD_D='M20 46h26a10 10 0 0 0 1.5-19.9A14 14 0 0 0 20.6 30 8 8 0 0 0 20 46z';
function cloudSvg(tr,grey){return '<path transform="'+tr+'" d="'+CLOUD_D+'" fill="url(#'+(grey?'gGrey':'gCloud')+')"/>';}
function moonSvg(tr){return '<g transform="'+tr+'"><circle cx="28" cy="34" r="17" fill="url(#gMoon)" mask="url(#mMoon)"/></g>';}
function icon(kind,night){
  var g='';
  switch(kind){
    case 'clear': g = night? moonSvg('translate(2,-2)') : sunSvg(32,32,11,17,24); break;
    case 'partly': g = (night? moonSvg('translate(-7,-9) scale(.78)') : sunSvg(23,23,8,13,18.5))+cloudSvg('translate(8 14) scale(.85)'); break;
    case 'cloud': g = cloudSvg('translate(-2 -2) scale(1.1)'); break;
    case 'fog': g='<path d="M14 24h36M10 34h44M16 44h32" stroke="#C7CEDB" stroke-width="3.6" stroke-linecap="round" fill="none"/>'; break;
    case 'drizzle': g=cloudSvg('translate(0 -6)',true)+'<path d="M25 44l-2 6M34 44l-2 6M43 44l-2 6" stroke="#64D2FF" stroke-width="3" stroke-linecap="round" fill="none"/>'; break;
    case 'rain': g=cloudSvg('translate(0 -7)',true)+'<path d="M24 43l-3 9M33 43l-3 9M42 43l-3 9M28.5 52l-2.5 7M37.5 52l-2.5 7" stroke="#4FB4FF" stroke-width="3.2" stroke-linecap="round" fill="none"/>'; break;
    case 'snow': g=cloudSvg('translate(0 -7)',true)+'<g fill="#fff"><circle cx="24" cy="47" r="2.4"/><circle cx="33" cy="52" r="2.4"/><circle cx="42" cy="47" r="2.4"/><circle cx="28" cy="58" r="2"/><circle cx="38" cy="58" r="2"/></g>'; break;
    case 'storm': g=cloudSvg('translate(0 -8)',true)+'<path d="M35 38l-9 13h6l-3 11 11-15h-6l3-9z" fill="#FFD60A"/>'; break;
    default: g = cloudSvg('translate(-2 -2) scale(1.1)');
  }
  return '<svg class="ic" viewBox="0 0 64 64">'+g+'</svg>';
}
function wmo(c){
  if(c===0) return ['clear','Ciel dégagé'];
  if(c===1) return ['clear','Plutôt dégagé'];
  if(c===2) return ['partly','Éclaircies'];
  if(c===3) return ['cloud','Couvert'];
  if(c===45||c===48) return ['fog','Brouillard'];
  if(c>=51&&c<=57) return ['drizzle','Bruine'];
  if(c>=61&&c<=65) return ['rain', c===65?'Pluie forte':(c===63?'Pluie':'Pluie faible')];
  if(c===66||c===67) return ['rain','Pluie verglaçante'];
  if(c>=71&&c<=77) return ['snow','Neige'];
  if(c>=80&&c<=82) return ['rain','Averses'];
  if(c===85||c===86) return ['snow','Averses de neige'];
  if(c>=95) return ['storm','Orage'];
  return ['cloud','Nuageux'];
}

   ICS : lecture des agendas Google / Pronote
   ===================================================================== */
function parseDT(v,p){
  var m=String(v).match(/^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)(\d\d)?(Z)?)?$/); if(!m) return null;
  var allDay=(p&&p.VALUE==='DATE')||!m[4], d;
  if(m[7]) d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)));
  else d=new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  return {t:d.getTime(),allDay:allDay};
}
function parseICS(text){
  var lines=String(text).replace(/\r?\n[ \t]/g,'').split(/\r?\n/), evs=[], cur=null;
  lines.forEach(function(l){
    if(l==='BEGIN:VEVENT'){cur={};return;}
    if(l==='END:VEVENT'){if(cur)evs.push(cur);cur=null;return;}
    if(!cur) return;
    var i=l.indexOf(':'); if(i<0) return;
    var parts=l.slice(0,i).split(';'), name=parts[0].toUpperCase(), val=l.slice(i+1), params={};
    parts.slice(1).forEach(function(x){var kv=x.split('=');params[kv[0].toUpperCase()]=kv[1];});
    if(name==='EXDATE'){cur.exdate=cur.exdate||[];val.split(',').forEach(function(x){var r=parseDT(x,params);if(r)cur.exdate.push(r.t);});return;}
    cur[name]={v:val,p:params};
  });
  return evs;
}
function unesc(s){return String(s||'').replace(/\\n/gi,' ').replace(/\\([,;\\])/g,'$1');}
function expand(evs,from,to){
  var out=[],ov={};
  evs.forEach(function(e){
    if(e['RECURRENCE-ID']){var r=parseDT(e['RECURRENCE-ID'].v,e['RECURRENCE-ID'].p);
      if(r){var u=e.UID?e.UID.v:'';(ov[u]=ov[u]||{})[r.t]=1;}}
  });
  evs.forEach(function(e){
    if(!e.DTSTART||(e.STATUS&&e.STATUS.v==='CANCELLED')) return;
    var s=parseDT(e.DTSTART.v,e.DTSTART.p); if(!s) return;
    var en=e.DTEND?parseDT(e.DTEND.v,e.DTEND.p):null;
    var dur=en?en.t-s.t:(s.allDay?86400000:3600000);
    var title=unesc(e.SUMMARY&&e.SUMMARY.v), loc=unesc(e.LOCATION&&e.LOCATION.v);
    function push(t){if(t+dur>from&&t<to) out.push({start:t,end:t+dur,allDay:s.allDay,title:title,loc:loc});}
    if(!e.RRULE){push(s.t);return;}
    var rule={};e.RRULE.v.split(';').forEach(function(kv){var a=kv.split('=');rule[a[0]]=a[1];});
    var uid=e.UID?e.UID.v:'', skip=ov[uid]||{}, ex={}; (e.exdate||[]).forEach(function(t){ex[t]=1;});
    var until=Infinity; if(rule.UNTIL){var u2=parseDT(rule.UNTIL,{}); if(u2) until=u2.t+(u2.allDay?86400000:0);}
    var itv=+(rule.INTERVAL||1), sd=new Date(s.t);
    var byday=rule.BYDAY?rule.BYDAY.split(',').map(function(x){return DAYS.indexOf(x.replace(/[^A-Z]/g,''));}):null;
    var n=Math.ceil((to-from)/86400000)+2, d0=new Date(from);
    for(var i=-1;i<=n;i++){
      var d=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+i,sd.getHours(),sd.getMinutes(),sd.getSeconds());
      var t=d.getTime(); if(t<s.t||t>until) continue;
      var days=dayDiff(s.t,t), ok=false;
      if(rule.FREQ==='DAILY') ok=days%itv===0;
      else if(rule.FREQ==='WEEKLY'){var wk=Math.floor((days+((sd.getDay()+6)%7))/7);
        ok=wk%itv===0&&(byday?byday.indexOf(d.getDay())>=0:d.getDay()===sd.getDay());}
      else if(rule.FREQ==='MONTHLY'){var mo=(d.getFullYear()-sd.getFullYear())*12+d.getMonth()-sd.getMonth();
        ok=mo%itv===0&&d.getDate()===sd.getDate();}
      else if(rule.FREQ==='YEARLY') ok=(d.getFullYear()-sd.getFullYear())%itv===0&&d.getMonth()===sd.getMonth()&&d.getDate()===sd.getDate();
      if(ok&&!skip[t]&&!ex[t]) push(t);
    }
  });
  return out;
}
function loadICS(c){
  if(!CONFIG.proxy||!CONFIG.key) return Promise.reject(new Error('no proxy'));
  return fetchT(api('cal='+encodeURIComponent(c.id)),15000).then(function(r){return r.text();}).then(parseICS);
}

function tripFor(d){
  var T=CONFIG.train, x=T.trips&&T.trips[d.getDay()];
  if(x&&x.A) x=x[weekLetter(d)];
  return x||{out:T.out,num:T.num||''};
}
function departures(now){
  var T=CONFIG.train, out=[];
  for(var i=0;i<9;i++){
    var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i);
    if(T.days.indexOf(d.getDay())<0) continue;
    var tr=tripFor(d);
    [[tr.out,T.from,T.to,tr.num||''],[T.back,T.to,T.from,'']].forEach(function(x){
      var a=x[0].split(':'), t=new Date(d.getFullYear(),d.getMonth(),d.getDate(),+a[0],+a[1]).getTime();
      if(t>now.getTime()) out.push({t:t,time:x[0],from:x[1],to:x[2],num:x[3]});
    });
  }
  return out.sort(function(a,b){return a.t-b.t;});
}
function durTxt(ms){
  var m=Math.max(1,Math.round(ms/60000)); if(m<60) return m+' min';
  var h=Math.floor(m/60), mm=m%60; if(h<24) return h+' h '+pad(mm);
  return Math.floor(h/24)+' j '+(h%24)+' h';
}
function dayWord(t,now){var k=dayDiff(now,t);return k===0?'Aujourd’hui':k===1?'Demain':JOURS[new Date(t).getDay()];}
function dkey(t){var d=new Date(t);return ''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());}

function tempColor(t){

  var idx=d.hourly.time.indexOf(nowKey); if(idx<0) idx=0;
  // heure par heure : 24 prochaines heures
  var hs='';
  for(k=0;k<24;k++){
    j=idx+k; if(j>=d.hourly.time.length) break;
    var hh=parseInt(d.hourly.time[j].slice(11,13),10), day=Math.floor(j/24);

/* =====================================================================
   PAGE 2 — CONSOMMATION ÉLECTRIQUE (compteur Linky / EDF)
   Les données (kWh par jour, jusqu'à hier) viennent du relais : ?data=conso
   ===================================================================== */
var edf={data:null,demo:true,ok:null,range:14,open:false};
/* Tarif bleu EDF, option Heures Creuses 9 kVA (facture du 20/09/2026, prix HT en vigueur depuis le 01/08/2026).
   Modifiable depuis le relais (champ "tarif") sans toucher à cette page. */
var TARIF={abo:14.90,ach:0.851,cta:0.15,hc:0.1018,hp:0.1479,accise:0.03062,tva:0.2,hcShare:0.359};
function fr(n,d){return Number(n).toFixed(d).replace('.',',');}
function pd2(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function sumK(a){var t=0;a.forEach(function(x){t+=x.k;});return t;}
function tarif(){var t={},k,o=(edf.data&&edf.data.tarif)||{};for(k in TARIF)t[k]=(o[k]!=null)?o[k]:TARIF[k];return t;}
/* € TTC de la seule consommation (énergie + accise + TVA), par kWh */
function vk(){var t=tarif();return (t.hcShare*t.hc+(1-t.hcShare)*t.hp+t.accise)*(1+t.tva);}
function eur(k){return k*vk();}
/* facture estimée d'un mois pour K kWh (abonnement complet inclus) */
function bill(K){
  var t=tarif(), hcK=K*t.hcShare, hpK=K-hcK, cta=t.abo*t.ach*t.cta;
  var L={abo:t.abo,hcK:hcK,hpK:hpK,hc:hcK*t.hc,hp:hpK*t.hp,acc:K*t.accise,cta:cta};
  L.ht=L.abo+L.hc+L.hp+L.acc+L.cta; L.tva=L.ht*t.tva; L.ttc=L.ht+L.tva; return L;
}
function demoEdf(){
  var days=[],n=new Date(),i;
  for(i=62;i>=1;i--){
    var d=new Date(n.getFullYear(),n.getMonth(),n.getDate()-i), we=d.getDay()===0||d.getDay()===6;
    var r=Math.abs(Math.sin(i*12.9898)*43758.5453)%1;
    days.push({d:ymd(d),k:Math.round((10.5+(we?3.5:0)+r*5+Math.sin(i/9)*1.5)*100)/100});
  }
  return {days:days};
}
function loadEdf(){if(MOB)return;
  if(!CONFIG.proxy||!CONFIG.key){if(!edf.data){edf.data=demoEdf();edf.demo=true;}render();return;}
  fetchT(api('data=conso'),20000).then(function(r){return r.json();}).then(function(j){
    if(!j||!j.days||!j.days.length) throw new Error('no data');
    edf.data=j;edf.demo=false;edf.ok=true;
  }).catch(function(){
    edf.ok=false;if(!edf.data){edf.data=demoEdf();edf.demo=true;}
  }).then(render);
}
function openEd(){edf.open=true;document.getElementById('ed').className='on';renderEdf();}
function closeEd(){edf.open=false;document.getElementById('ed').className='';}
function renderEdf(){
  var e=edf.data; if(!e) return;
  var days=e.days, L=days.length, last=days[L-1], ld=pd2(last.d), t=tarif();
  var tag=edf.demo?'<span class="pill">démo</span>':(edf.ok===false?'<span class="pill">hors ligne</span>':'Enedis · Linky');

  /* ---- mois en cours : kWh à ce jour, projection, facture estimée ---- */
  var ym=last.d.slice(0,7), pm=new Date(ld.getFullYear(),ld.getMonth()-1,1), pk=ymd(pm).slice(0,7), ms=0, pms=0, pc=0;
  days.forEach(function(x){var k=x.d.slice(0,7);if(k===ym)ms+=x.k;else if(k===pk){pms+=x.k;pc++;}});
  var dim=new Date(ld.getFullYear(),ld.getMonth()+1,0).getDate(), proj=ms/ld.getDate()*dim;
  var pmFull=pc===new Date(pm.getFullYear(),pm.getMonth()+1,0).getDate();
  var B=bill(proj), toDate=eur(ms)+(t.abo*(1+t.ach*t.cta))*(1+t.tva)*ld.getDate()/dim;
  var mois=MOIS[ld.getMonth()], de=/^[aeiouhàâéèêîôû]/i.test(mois)?'d’':'de ';

  /* ---- vignette (page 2) ---- */
  var mini='', m7=days.slice(-14), mm=1;
  m7.forEach(function(x){mm=Math.max(mm,x.k);});
  m7.forEach(function(x,i){mini+='<i'+(i===m7.length-1?' class="l"':'')+' style="height:'+Math.max(6,x.k/mm*100)+'%"></i>';});
  put('e-card','<div class="label"><span>Électricité</span><span class="r">'+tag+'</span></div>'+
    '<div class="tbig">'+fr(B.ttc,0)+'<small>€ estimés</small></div>'+
    '<div class="tsub">facture '+de+mois+' (abonnement et taxes inclus)</div>'+
    '<div class="mini">'+mini+'</div>'+
    '<div class="mnote"><b>'+fr(ms,0)+' kWh</b> à ce jour · hier <b>'+fr(last.k,1)+' kWh</b></div>');

  /* ---- plein écran : graphique ---- */
  var n=Math.min(edf.range,L), sl=days.slice(-n), mx=0, sum=sumK(sl);
  sl.forEach(function(x){mx=Math.max(mx,x.k);});
  var step=mx>40?10:5, top=Math.max(step,Math.ceil(mx/step)*step), avg=sum/n, bars='';
  sl.forEach(function(x,ix){
    var d=pd2(x.d), we=d.getDay()===0||d.getDay()===6, isLast=ix===n-1;
    var lab=(n<=14||(n-1-ix)%5===0)?'LMMJVSD'.charAt((d.getDay()+6)%7)+'<br>'+d.getDate():'';
    var val=(n<=14||isLast)?'<em>'+fr(x.k,1)+'</em>':'';
    bars+='<div class="b'+(we?' we':'')+(isLast?' last':'')+'">'+val+'<i style="height:'+(x.k/top*100)+'%"></i><u>'+lab+'</u></div>';
  });
  var gl=[0,top/2,top].map(function(v){return '<div class="gl" style="bottom:'+(v/top*100)+'%"><span>'+fr(v,v%1?1:0)+'</span></div>';}).join('');
  var rng=[7,14,30].map(function(v){return '<button data-r="'+v+'" class="'+(edf.range===v?'on':'')+'">'+v+' j</button>';}).join('');
  put('ed-chart','<div class="label"><span>Consommation électrique</span><span class="r">'+tag+'</span></div>'+
    '<div class="ehead"><div><div class="ebig">'+fr(sum,0)+'<small>kWh sur '+n+' jours</small></div>'+
    '<div class="esub">≈ '+fr(eur(sum),2)+' € de consommation (hors abonnement) · moyenne '+fr(avg,1)+' kWh par jour</div></div><div class="rng">'+rng+'</div></div>'+
    '<div class="chart"><div class="plot">'+gl+'<div class="bars">'+bars+'</div><div class="avg" style="bottom:'+(avg/top*100)+'%"><span>moy. '+fr(avg,1)+'</span></div></div></div>');

  /* ---- plein écran : estimation de la facture du mois ---- */
  function ln(l,k,v,c){return '<div class="bl'+(c?' '+c:'')+'"><span>'+l+'</span><em>'+k+'</em><b>'+v+'</b></div>';}
  put('ed-bill','<div class="label"><span>Facture estimée</span><span class="r">'+cap(mois)+' · fin de mois</span></div>'+
    '<div class="tbig">'+fr(B.ttc,0)+'<small>€ TTC</small></div>'+
    '<div class="tsub">'+fr(proj,0)+' kWh prévus · '+fr(toDate,0)+' € à ce jour</div>'+
    '<div class="bills">'+
      ln('Abonnement 9 kVA','',fr(B.abo,2)+' €')+
      ln('Heures creuses',fr(B.hcK,0)+' kWh',fr(B.hc,2)+' €')+
      ln('Heures pleines',fr(B.hpK,0)+' kWh',fr(B.hp,2)+' €')+
      ln('Accise sur l’électricité',fr(proj,0)+' kWh',fr(B.acc,2)+' €')+
      ln('Contribution tarifaire (CTA)','',fr(B.cta,2)+' €')+
      ln('Total hors TVA','',fr(B.ht,2)+' €','g')+
      ln('TVA '+fr(t.tva*100,0)+' %','',fr(B.tva,2)+' €')+
      ln('Total TTC estimé','',fr(B.ttc,2)+' €','t')+
    '</div>'+
    (pmFull?'<div class="tnote">Mois dernier : <b>'+fr(pms,0)+' kWh</b> ≈ <b>'+fr(bill(pms).ttc,0)+' €</b></div>':'')+
    '<div class="bnote">Estimation d’après les tarifs de ta facture du 20/09/2026. Les heures creuses sont estimées à '+fr(t.hcShare*100,0)+' % de la consommation (part constatée sur ta facture). Ton prélèvement mensuel peut différer : il est lissé sur l’année.</div>');

  /* ---- plein écran : hier ---- */
  var prev7=days.slice(-8,-1), a7=prev7.length?sumK(prev7)/prev7.length:last.k, dl=(last.k/a7-1)*100;
  put('ed-yday','<div class="label"><span>Hier</span><span class="r">'+cap(JOURS[ld.getDay()])+' '+ld.getDate()+' '+MOIS[ld.getMonth()]+'</span></div>'+
    '<div class="tbig">'+fr(last.k,1)+'<small>kWh</small></div><div class="tsub">≈ '+fr(eur(last.k),2)+' €</div>'+
    '<div class="tfoot"><span class="delta '+(dl<=0?'down':'up')+'">'+(dl<=0?'−':'+')+fr(Math.abs(dl),0)+' %</span><span class="tnote">par rapport à la moyenne des 7 jours précédents ('+fr(a7,1)+' kWh)</span></div>');

  /* ---- plein écran : semaine ---- */
  var cnt=((ld.getDay()+6)%7)+1, cur=days.slice(-cnt), prv=days.slice(-cnt-7,-7), cs=sumK(cur), ps=sumK(prv), wd=ps?(cs/ps-1)*100:0, wm=Math.max(cs,ps,1);
  put('ed-week','<div class="label"><span>Cette semaine</span><span class="r">'+cnt+(cnt>1?' jours':' jour')+'</span></div>'+
    '<div class="tbig">'+fr(cs,0)+'<small>kWh</small></div><div class="tsub">≈ '+fr(eur(cs),2)+' €</div>'+
    '<div class="tfoot col"><div class="wrow"><span>Cette semaine</span><div class="pbar"><u style="width:'+(cs/wm*100)+'%"></u></div><b>'+fr(cs,0)+'</b></div>'+
    (prv.length===cnt?'<div class="wrow"><span>Semaine précédente</span><div class="pbar"><u class="g" style="width:'+(ps/wm*100)+'%"></u></div><b>'+fr(ps,0)+'</b></div>'+
    '<div class="tnote"><span class="delta '+(wd<=0?'down':'up')+'">'+(wd<=0?'−':'+')+fr(Math.abs(wd),0)+' %</span> sur les mêmes jours</div>':'')+'</div>');
}

function mnLoadLocal(){try{mn.log=JSON.parse(localStorage.getItem('dbm')||'[]')||[];}catch(e){mn.log=[];}}
function mnSaveLocal(){try{localStorage.setItem('dbm',JSON.stringify(mn.log));}catch(e){}}
function mnMerge(a,b){
  var m={},out=[];
  a.concat(b).forEach(function(x){var o=m[x.i];if(!o){m[x.i]=x;}else if(x.x&&!o.x){m[x.i]=x;}});
  for(var k in m) out.push(m[k]);
  out.sort(function(p,q){return p.t-q.t;}); return out;
}
function mnSync(push){if(MOB)return;

    mn.log=mnMerge(mn.log,(j&&j.log)||[]); mnSaveLocal();
    if(push){
      return fetch(api('data=tasks'),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({log:mn.log})}).then(function(r){if(!r.ok)throw new Error(r.status);});
    }

    hh+='<div class="hr2"><span>'+JOURS[d.getDay()].slice(0,3)+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())+'</span>'+
      '<b style="color:'+(cols[x.w]||'#fff')+'">'+esc(x.w)+'</b><span style="color:var(--t1)">'+esc(x.a)+'</span><em>+'+x.p+'</em>'+
      '<button type="button" class="'+(conf?'c':'')+'" data-act="del" data-id="'+x.i+'">'+(conf?'Sûr ?':'×')+'</button></div>';
  });
  put('mn-his','<div class="label"><span>Historique</span><span class="r">'+hs.length+'</span></div><div class="hl2">'+(hh||'<div class="tnote" style="margin-top:.8rem">Rien ce mois-ci pour l’instant.</div>')+'</div>');
}
function openMn(){mn.open=true;mn.kid=-1;mn.confirm='';mn.month=ymd(new Date()).slice(0,7);document.getElementById('mn').className='on';renderMn();mnSync(false);}
function closeMn(){mn.open=false;document.getElementById('mn').className='';document.getElementById('mn-toast').className='';}
function mnInit(){
  mnLoadLocal(); mn.month=ymd(new Date()).slice(0,7);
  document.getElementById('m-card').addEventListener('click',openMn);
  document.getElementById('mn-back').addEventListener('click',closeMn);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMn();});
  function act(e){
    var t=e.target; while(t&&t.getAttribute&&!t.getAttribute('data-act')) t=t.parentNode;
    if(!t||!t.getAttribute) return; var a=t.getAttribute('data-act');
    if(a==='kid'){var i=+t.getAttribute('data-i');mn.kid=(mn.kid===i?-1:i);renderMn();}
    else if(a==='task') mnAdd(t.getAttribute('data-t'));
    else if(a==='prev') mnMonthShift(-1);
    else if(a==='next') mnMonthShift(1);
    else if(a==='undo'){if(mn.last)mnDel(mn.last);mn.last='';document.getElementById('mn-toast').className='';}
    else if(a==='del'){var id=t.getAttribute('data-id'); if(mn.confirm===id) mnDel(id); else {mn.confirm=id;renderMn();setTimeout(function(){if(mn.confirm===id){mn.confirm='';renderMn();}},4000);}}
  }
  document.getElementById('mn-in').addEventListener('click',act);
  document.getElementById('mn-toast').addEventListener('click',act);
  mnSync(false);
}
